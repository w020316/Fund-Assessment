app = "fund-assessment"
primary_region = "sin"

# 文档一致性修复(2026-07-31):原配置引用不存在的 Dockerfile 会导致 Fly.io 部署失败。
# 项目实际部署在 Render 上(render.yaml),Fly.io 为备选方案。
# 如需 Fly.io 部署,请先创建 Dockerfile 或改用 Fly.io Buildpack。

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  hard_limit = 200
  soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  HOST = "0.0.0.0"
  PORT = "8000"
