services:
  - type: web
    name: fund-assessment
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "*"
      # AI 分析所需(至少配置一个)
      - key: AGNES_API_KEY
        sync: false
      - key: TTAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      # 鉴权 Token(写/交易端点保护)
      - key: ADMIN_TOKEN
        sync: false
      # 数据源(可选)
      - key: TUSHARE_TOKEN
        sync: false
