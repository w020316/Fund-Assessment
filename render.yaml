services:
  - type: web
    name: fund-assessment
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "*"
      # AI 分析所需(至少配置一个)
      - key: AGNES_API_KEY
        sync: false
      - key: TTAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      # ===== P1 新增:免费 LLM Provider(任选其一即可,推荐智谱) =====
      - key: ZHIPU_API_KEY
        sync: false
      - key: ZHIPU_API_KEYS
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # 鉴权 Token(写/交易端点保护)
      - key: ADMIN_TOKEN
        sync: false
      # 数据源(可选)
      - key: TUSHARE_TOKEN
        sync: false
