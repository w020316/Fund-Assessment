services:
  - type: web
    name: fund-assessment
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HOST
        value: "0.0.0.0"
      # CORS 白名单（2026-10-26 修复：原值为 "*"）
      # 前端由本服务同源托管（/static/index.html），跨域本无必要；
      # 配成 "*" 会让任意站点跨域读取 API 响应（实测 Origin 被原样回显）。
      # 如后续加自定义域名，把域名追加在这里（逗号分隔）。
      - key: CORS_ORIGINS
        value: "https://fund-assessment.onrender.com"
      # 反向代理信任链（2026-10-26 新增）
      # uvicorn 默认 forwarded_allow_ips=127.0.0.1，而 Render 的反代不是本机地址，
      # 导致 X-Forwarded-For 被忽略、限流键退化为代理 IP（全站共用一个桶）。
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # AI 分析所需(至少配置一个)
      - key: AGNES_API_KEY
        sync: false
      - key: TTAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      # ===== P1 新增:免费 LLM Provider(任选其一即可,推荐智谱) =====
      - key: ZHIPU_API_KEY
        sync: false
      - key: ZHIPU_API_KEYS
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # 鉴权 Token(写/交易端点保护)
      - key: ADMIN_TOKEN
        sync: false
      # 数据源(可选)
      - key: TUSHARE_TOKEN
        sync: false
