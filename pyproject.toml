[project]
name = "fund-assessment"
version = "1.0.0"
description = "QuantFlow Pro quantitative trading system"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "requests==2.32.3",
    "pandas==2.3.3",
    "numpy==2.5.1",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "python-dotenv==1.1.0",
    "beautifulsoup4==4.13.4",
    "html5lib==1.1",
    "pyyaml==6.0.2",
    "apscheduler==3.11.0",
]

[project.optional-dependencies]
market-data = [
    "akshare==1.16.94",
    "tushare==1.4.18",
    "tdxpy==0.2.7",
    "mootdx==0.9.11",
]
full = [
    "fund-assessment[market-data]",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "web*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 排除第三方库(pylibs/)和文档目录的测试
norecursedirs = ["pylibs", "docs", ".git", "data", "node_modules"]
# 添加标记
markers = [
    "slow: 标记慢测试(>1s)",
    "integration: 集成测试(需要外部服务)",
]
# 避免测试收集时的警告
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
