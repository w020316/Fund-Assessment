[project]
name = "fund-assessment"
version = "1.0.0"
description = "QuantFlow Pro quantitative trading system"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # 版本基准(2026-11-05): 与本机实测通过全量测试的版本保持一致
    "fastapi==0.136.1",
    "starlette==1.0.0",
    "uvicorn[standard]==0.46.0",
    "requests==2.34.1",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "beautifulsoup4==4.15.0",
    "html5lib==1.1",
    "pyyaml==6.0.3",
    "apscheduler==3.11.2",
    "httpx==0.25.2",
    "json-repair==0.64.2",
    "slowapi==0.1.10",
    "openpyxl==3.1.5",
    "python-multipart==0.0.28",
]

[project.optional-dependencies]
market-data = [
    "akshare==1.18.64",
    "tushare==1.4.29",
    "tdxpy==0.2.7",
    "mootdx==0.11.7",
]
full = [
    "fund-assessment[market-data]",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "web*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 排除第三方库(pylibs/)和文档目录的测试
norecursedirs = ["pylibs", "docs", ".git", "data", "node_modules"]
# 添加标记
markers = [
    "slow: 标记慢测试(>1s)",
    "integration: 集成测试(需要外部服务)",
]
# 避免测试收集时的警告
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
